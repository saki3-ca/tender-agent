# ACNABIN Tender Monitor — runtime settings

# Active-status rules (see app/classification/status.py)
active:
  # A notice with no deadline counts as active if it was published within this many days.
  recent_publication_days: 7
  timezone: "Asia/Dhaka"

# Crawler
crawler:
  request_timeout_seconds: 30
  concurrent_sources: 6          # sources fetched in parallel (different domains)
  per_domain_delay_seconds: 1.5  # politeness delay between requests to the same domain
  max_documents_per_source: 25   # tender PDFs/DOCX downloaded per source per run
  max_document_bytes: 15000000
  document_text_chars: 20000     # characters of document text kept for classification

# Overall run budget (GitHub Actions job has a 20 minute timeout)
run_time_budget_minutes: 14

# Telegram / email alerts are sent for newly discovered, active Priority tenders.
alerts:
  enabled: true

dashboard_base_url: "https://acnabin-tenders.pages.dev"
