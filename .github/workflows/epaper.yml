name: Daily E-Paper Tenders

on:
  schedule:
    # Asia/Dhaka is UTC+6. Morning read at 07:30 Dhaka; the 11:30 run retries only the
    # newspapers that failed (successful ones are skipped by min_interval_hours).
    - cron: "30 1 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: epaper
  cancel-in-progress: false

jobs:
  run-epaper:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read today's e-paper editions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL || 'tenders@acnabin.com' }}
          RUN_TIME_BUDGET_MINUTES: "80"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          EPAPER_PROTHOMALO_USER: ${{ secrets.EPAPER_PROTHOMALO_USER }}
          EPAPER_PROTHOMALO_PASSWORD: ${{ secrets.EPAPER_PROTHOMALO_PASSWORD }}
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL || 'https://acnabin-tenders.pages.dev' }}
        run: |
          python run_monitor.py --epaper
