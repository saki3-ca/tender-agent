name: Daily E-Paper Tenders

on:
  schedule:
    # Asia/Dhaka is UTC+6. One full read of every newspaper a day at 08:00 Dhaka (GitHub may start it
    # 10-40 min late). The 10:00 and 12:00 runs retry only the newspapers that failed at 08:00
    # (successful ones are skipped by min_interval_hours = 10).
    - cron: "0 2 * * *"
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      browser_papers_only:
        description: "Only Jugantor and Bangladesh Pratidin (the Cloudflare-protected papers), to test the browser"
        type: boolean
        default: false

concurrency:
  group: epaper
  cancel-in-progress: false

jobs:
  run-epaper:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome, a virtual display and OCR (Bangla + English)
        run: |
          python -m playwright install --with-deps chromium
          # Tesseract reads every page for free first; only pages with tender words go to Gemini, and the OCR
          # text is used when Gemini's free quota runs out (app/parsers/epaper_ocr.py)
          sudo apt-get install -y xvfb tesseract-ocr tesseract-ocr-ben

      - name: Read today's e-paper editions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL || 'tenders@acnabin.com' }}
          RUN_TIME_BUDGET_MINUTES: "80"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          EPAPER_PC_BROWSER: "1"
          EPAPER_PROXY_URL: ${{ secrets.EPAPER_PROXY_URL }}
          EPAPER_PROTHOMALO_USER: ${{ secrets.EPAPER_PROTHOMALO_USER }}
          EPAPER_PROTHOMALO_PASSWORD: ${{ secrets.EPAPER_PROTHOMALO_PASSWORD }}
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL || 'https://acnabin-tenders.pages.dev' }}
        run: |
          # xvfb gives Chrome a virtual screen, so Jugantor and Pratidin open in a real (headed) browser
          if [ "${{ inputs.browser_papers_only }}" = "true" ]; then
            xvfb-run -a python run_monitor.py --pc-browser
          else
            xvfb-run -a python run_monitor.py --epaper
          fi
