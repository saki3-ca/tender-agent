name: Hourly Monitor & Intelligence Worker

on:
  schedule:
    # Asia/Dhaka is UTC+6:
    # 00:00 Dhaka = 18:00 UTC
    - cron: "7 18 * * *"
    # 08:00–20:00 Dhaka = 02:00–14:00 UTC (hourly)
    - cron: "7 2-14 * * *"
  workflow_dispatch:
    inputs:
      force_mode:
        description: "Execution mode override (full, triage_only, off)"
        required: false
        default: ""

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Tesseract OCR eng+ben)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben libtesseract-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Secret Leak Protection Check
        run: |
          python -c "
          import os, re, sys
          suspicious = [
              r'gsk_[A-Za-z0-9_-]{20,}',
              r'AIzaSy[A-Za-z0-9_-]{33}',
              r'eyJhbGciOi[A-Za-z0-9_.-]{40,}'
          ]
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs: dirs.remove('.git')
              for f in files:
                  if f.endswith(('.py', '.json', '.yaml', '.yml', '.md', '.html', '.js')):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fh:
                          txt = fh.read()
                          for pat in suspicious:
                              if re.search(pat, txt) and not 'example' in p:
                                  print(f'FATAL: Potential hardcoded secret in {p}')
                                  sys.exit(1)
          print('Secrets leak check passed.')
          "

      - name: Run ACNABIN Tender Monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_MODE: ${{ github.event.inputs.force_mode || secrets.AI_MODE || 'full' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TRIAGE_MODEL: ${{ secrets.GROQ_TRIAGE_MODEL || 'llama-3.3-70b-versatile' }}
          GROQ_REVIEW_MODEL: ${{ secrets.GROQ_REVIEW_MODEL || 'mixtral-8x7b-32768' }}
          GROQ_DAILY_CALL_LIMIT: ${{ secrets.GROQ_DAILY_CALL_LIMIT || '1000' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMBED_MODEL: ${{ secrets.CLOUDFLARE_EMBED_MODEL || '@cf/baai/bge-m3' }}
          CLOUDFLARE_DAILY_CALL_LIMIT: ${{ secrets.CLOUDFLARE_DAILY_CALL_LIMIT || '5000' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_DAILY_CALL_LIMIT: ${{ secrets.GEMINI_DAILY_CALL_LIMIT || '500' }}
          AI_MAX_INPUT_CHARS: ${{ secrets.AI_MAX_INPUT_CHARS || '12000' }}
          SEMANTIC_THRESHOLD: ${{ secrets.SEMANTIC_THRESHOLD || '0.78' }}
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER || 'google' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          SEARCH_DAILY_QUERY_LIMIT: ${{ secrets.SEARCH_DAILY_QUERY_LIMIT || '100' }}
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL || 'tenders@acnabin.com' }}
          RUN_TIME_BUDGET_MINUTES: ${{ secrets.RUN_TIME_BUDGET_MINUTES || '14' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL || 'https://tender-agent-d01.pages.dev' }}
        run: |
          python run_monitor.py
