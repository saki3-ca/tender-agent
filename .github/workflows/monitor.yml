name: Hourly Tender Monitor

on:
  schedule:
    # Asia/Dhaka is UTC+6:
    # 00:00 Dhaka = 18:00 UTC
    - cron: "7 18 * * *"
    # 08:00–20:00 Dhaka = 02:00–14:00 UTC (hourly)
    - cron: "7 2-14 * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Tesseract OCR eng+ben)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben libtesseract-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Secret Leak Protection Check
        run: |
          python -c "
          import os, re, sys
          suspicious = [
              r'gsk_[A-Za-z0-9_-]{20,}',
              r'AIzaSy[A-Za-z0-9_-]{33}',
              r'eyJhbGciOi[A-Za-z0-9_.-]{40,}'
          ]
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs: dirs.remove('.git')
              for f in files:
                  if f.endswith(('.py', '.json', '.yaml', '.yml', '.md', '.html', '.js')):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fh:
                          txt = fh.read()
                          for pat in suspicious:
                              if re.search(pat, txt) and not 'example' in p:
                                  print(f'FATAL: Potential hardcoded secret in {p}')
                                  sys.exit(1)
          print('Secrets leak check passed.')
          "

      - name: Run ACNABIN Tender Monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL || 'tenders@acnabin.com' }}
          RUN_TIME_BUDGET_MINUTES: ${{ secrets.RUN_TIME_BUDGET_MINUTES || '14' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALLTENDER_USER: ${{ secrets.ALLTENDER_USER }}
          ALLTENDER_PASSWORD: ${{ secrets.ALLTENDER_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EPAPER_PROTHOMALO_USER: ${{ secrets.EPAPER_PROTHOMALO_USER }}
          EPAPER_PROTHOMALO_PASSWORD: ${{ secrets.EPAPER_PROTHOMALO_PASSWORD }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL || 'https://acnabin-tenders.pages.dev' }}
        # Newspaper e-papers are read by epaper.yml (they take longer than this run's budget).
        run: |
          python run_monitor.py --no-epaper

