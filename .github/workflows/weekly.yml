name: Weekly Organization Discovery & Maintenance

on:
  schedule:
    # Run every Sunday at 01:00 UTC (07:00 Asia/Dhaka)
    - cron: "0 1 * * 0"
  workflow_dispatch: {}

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  weekly-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Discovery & Retention Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_MODE: ${{ secrets.AI_MODE || 'full' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER || 'google' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL || 'https://tender-agent-d01.pages.dev' }}
        run: |
          python run_weekly.py
