name: Weekly Source Health Check

on:
  schedule:
    # Run every Sunday at 01:00 UTC (07:00 Asia/Dhaka)
    - cron: "0 1 * * 0"
  workflow_dispatch: {}

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  weekly-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check every tender source and suggest replacements for broken ones
        run: |
          python scripts/check_sources.py

      - name: Upload source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-report
          path: data/source_check.json
