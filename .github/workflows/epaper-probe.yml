name: E-paper probe (temporary)
on:
  push:
    branches: ["claude/epaper-probe"]
    paths: ["scripts/probe_epapers.py", ".github/workflows/epaper-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install playwright httpx && python -m playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - name: Four unknown sites (bundled Chromium)
        run: xvfb-run -a python scripts/probe_epapers.py
        env:
          PROBE_SITES: "https://enayadiganta.com/ https://epaper.observerbd.com/ https://eamardesh.com/ https://epaper.deshrupantor.com/"
      - name: Cloudflare-blocked sites with installed Google Chrome
        run: xvfb-run -a python scripts/probe_epapers.py
        env:
          PROBE_CHANNEL: chrome
          PROBE_SITES: "https://epaper.samakal.com/ https://epaper.newagebd.net/ https://epaper.protidinerbangladesh.com/"
      - name: Dhaka Tribune service
        run: python scripts/probe_epapers.py
        env:
          PROBE_DT: "1"
